<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Benchmate — React + Vite Studio</title>
  <script>
    if (window.location.protocol === "file:") {
      var target = /[\\/]dist[\\/]index\.html$/i.test(window.location.pathname)
        ? "../portable/index.html"
        : "./portable/index.html";
      window.location.replace(target);
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    html, body { background: #0B0C0E; color: #F3F4F6; margin: 0; font-family: Inter, system-ui, sans-serif; }
    .file-fallback { display: none; padding: 48px 24px; max-width: 560px; margin: 80px auto; background: #121418; border: 1px solid #262B36; border-radius: 12px; text-align: center; }
    .file-fallback a { display: inline-block; margin-top: 16px; padding: 10px 18px; background: #06B6D4; color: #061318; font-weight: 700; text-decoration: none; border-radius: 8px; }
  </style>
</head>
<body>
  <div id="root">
    <div id="file-fallback" class="file-fallback">
      <h2 style="margin:0 0 8px;">Opening AI Benchmate Portable Edition...</h2>
      <p style="color:#9CA3AF;margin:0;">Direct <code>file://</code> launch detected. Redirecting to the Zero-Server Portable Edition.</p>
      <a href="./portable/index.html">Launch Portable Edition Now →</a>
    </div>
  </div>
  <script>
    if (window.location.protocol === "file:") {
      var fb = document.getElementById("file-fallback");
      if (fb) fb.style.display = "block";
    }
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
